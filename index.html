<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Test de cercanía parento-filial y riesgo de deserción escolar</title>
<style>
:root{--bg:#f3f6f5;--sf:#fff;--tx:#17302f;--mu:#5b706e;--ac:#0f6b66;--ac2:#e3f1ef;--bd:#d3dedc;--ok:#2f8f5b;--wa:#c98a14;--hi:#d2622a;--vh:#b3261e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a19;--sf:#172625;--tx:#e6f0ee;--mu:#9bb3b0;--ac:#4cc3ba;--ac2:#1d3533;--bd:#2c4442;--ok:#55c585;--wa:#e5ae3a;--hi:#ee8a55;--vh:#f26b62;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1a19;--sf:#172625;--tx:#e6f0ee;--mu:#9bb3b0;--ac:#4cc3ba;--ac2:#1d3533;--bd:#2c4442;--ok:#55c585;--wa:#e5ae3a;--hi:#ee8a55;--vh:#f26b62;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 "Source Serif 4",Georgia,"Times New Roman",serif}
h1,h2,h3,button,label,.sans{font-family:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:720px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.55rem;line-height:1.2;margin:.2em 0 .4em}
h2{font-size:1.2rem;margin:1.6em 0 .5em;border-bottom:2px solid var(--ac);padding-bottom:.25em}
h3{font-size:1rem;margin:1em 0 .3em}
p{margin:.5em 0}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:16px;margin:14px 0}
.mu{color:var(--mu);font-size:.9rem}
label{display:block;font-size:.85rem;font-weight:600;margin:12px 0 4px}
input,select{width:100%;padding:11px;font:inherit;font-size:1rem;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx)}
button{font-size:1rem;font-weight:600;border:0;border-radius:8px;padding:13px 16px;cursor:pointer;background:var(--ac);color:#fff}
button.s{background:var(--ac2);color:var(--ac);border:1px solid var(--bd)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--wa);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.row>button{flex:1 1 140px}
.bar{height:6px;background:var(--bd);border-radius:3px;overflow:hidden;margin:6px 0 16px}
.bar i{display:block;height:100%;background:var(--ac)}
.q{font-size:1.15rem;line-height:1.45;margin:10px 0 16px}
.opt{display:block;width:100%;text-align:left;margin:8px 0;background:var(--sf);color:var(--tx);border:1.5px solid var(--bd);font-weight:500}
.opt:active{background:var(--ac2);border-color:var(--ac)}
.tag{display:inline-block;font:600 .8rem "Inter",system-ui,sans-serif;padding:3px 10px;border-radius:99px;color:#fff}
.sum{border-left:5px solid var(--ac);background:var(--ac2)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem;min-width:420px}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--bd);vertical-align:top}
th{font-family:"Inter",system-ui,sans-serif;font-size:.8rem}
.mb{height:10px;background:var(--bd);border-radius:5px;min-width:90px}
.mb i{display:block;height:100%;border-radius:5px}
.al{border:1.5px solid var(--vh);color:var(--vh);padding:10px 12px;border-radius:8px;margin:12px 0;font-size:.95rem}
@media print{body{background:#fff;color:#000}.noprint{display:none}.card{break-inside:avoid}}
</style>
</head>
<body>
<main id="app"></main>
<script>
var DIMS=[
{k:'com',n:'Comunicación',hi:'Existe un canal de diálogo abierto y frecuente; el/la menor comparte vivencias escolares con naturalidad.',lo:'El diálogo es escaso o conflictivo, lo que limita la detección temprana de dificultades escolares.',rec:'Establecer un momento diario de conversación sin pantallas y practicar escucha activa antes de corregir.'},
{k:'tie',n:'Tiempo compartido y conocimiento cotidiano',hi:'Hay presencia regular y buen conocimiento de rutinas y entorno social del/de la menor.',lo:'Se observa baja presencia y escaso conocimiento de rutinas y pares, factor asociado a menor supervisión.',rec:'Programar actividades fijas semanales (comidas, deportes, paseos) y conocer su círculo social.'},
{k:'cal',n:'Calidez y apoyo emocional',hi:'El vínculo afectivo es seguro: el/la menor recurre al progenitor ante malestar emocional.',lo:'Se identifica un vínculo afectivo debilitado, con posible falta de validación emocional.',rec:'Incrementar expresiones de afecto y validar emociones sin minimizarlas. Valorar orientación psicológica.'},
{k:'aca',n:'Involucramiento académico',hi:'El progenitor conoce el desempeño escolar y acompaña tareas y comunicaciones del centro.',lo:'El seguimiento académico es limitado, lo que retrasa la detección de rezago y desmotivación.',rec:'Reunirse con tutores cada período, revisar calificaciones y acordar rutinas de estudio.'},
{k:'mot',n:'Expectativas y motivación',hi:'Se dialoga sobre metas educativas y se refuerza el esfuerzo, no solo el resultado.',lo:'Las expectativas generan tensión o no se conversan, lo que puede erosionar la motivación escolar.',rec:'Co-construir metas realistas, reconocer el esfuerzo y reducir la presión centrada solo en notas.'}];
var ITEMS=[
['com','Mi hijo/a me cuenta espontáneamente cómo le fue en la escuela.',0],
['com','Conversamos al menos 15 minutos al día sin pantallas.',0],
['com','Cuando hablamos de la escuela, terminamos en regaños o discusiones.',1],
['tie','Compartimos comidas o actividades varias veces por semana.',0],
['tie','Conozco a sus amistades y sus rutinas diarias.',0],
['tie','Por trabajo u otras obligaciones, paso poco tiempo con él/ella.',1],
['cal','Expreso afecto con palabras o gestos con frecuencia.',0],
['cal','Mi hijo/a acude a mí cuando está triste o preocupado/a.',0],
['cal','Me cuesta reconocer o validar lo que siente.',1],
['aca','Sé qué materias le cuestan y cuáles son sus calificaciones.',0],
['aca','Acompaño o reviso sus tareas y proyectos.',0],
['aca','Asisto poco a reuniones o comunicaciones de la escuela.',1],
['mot','Hablamos de sus metas y de su futuro educativo.',0],
['mot','Lo/la felicito por su esfuerzo, no solo por las notas.',0],
['mot','Las exigencias académicas generan mucha tensión entre nosotros.',1]];
var SIG=[
'Ha faltado a clases o llegado tarde con frecuencia.',
'Muestra desinterés o desmotivación por la escuela.',
'Sus calificaciones han bajado o ha reprobado materias.',
'Ha expresado que quiere dejar de estudiar.'];
var OPT=['Nunca','Rara vez','A veces','Con frecuencia','Siempre'];
var st={step:'intro',i:0,d:{},ans:[],res:[]};
var app=document.getElementById('app');
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function col(p,rev){var v=rev?100-p:p;return v>=75?'var(--ok)':v>=55?'var(--ac)':v>=40?'var(--wa)':'var(--vh)'}
function lvl(r){return r<25?['Bajo','var(--ok)']:r<45?['Moderado','var(--wa)']:r<65?['Alto','var(--hi)']:['Muy alto','var(--vh)']}
function band(p){return p>=75?'Fortaleza':p>=55?'Adecuado':p>=40?'Área de mejora':'Área crítica'}
function intro(){
app.innerHTML='<h1>Test de cercanía parento-filial</h1><p class="mu">Evalúa el vínculo entre un progenitor y su hijo/a y estima el riesgo de deserción escolar. Genera un informe clínico y un resumen. Dura unos 5 minutos.</p>'+
'<div class="card"><label for="rol">¿Quién responde?</label><select id="rol"><option>Madre</option><option>Padre</option><option>Tutor/a</option></select>'+
'<label for="nom">Nombre (opcional)</label><input id="nom" autocomplete="off">'+
'<label for="hij">Nombre del hijo/a</label><input id="hij" autocomplete="off">'+
'<label for="eda">Edad del hijo/a</label><input id="eda" type="number" min="5" max="19" inputmode="numeric">'+
'<label for="gra">Grado escolar</label><input id="gra" placeholder="Ej.: 2.º de secundaria" autocomplete="off">'+
'<div class="row"><button id="go">Comenzar test</button></div></div>'+
(st.res.length?'<div class="row"><button class="s" id="vr">Ver informes anteriores ('+st.res.length+')</button></div>':'')+
'<p class="mu">Herramienta de cribado orientativa, no es un instrumento clínico validado ni sustituye una evaluación profesional.</p>';
document.getElementById('go').onclick=function(){
var h=document.getElementById('hij').value.trim(),e=+document.getElementById('eda').value;
if(!h||!e){alert('Escribe el nombre y la edad del hijo/a para continuar.');return}
st.d={rol:document.getElementById('rol').value,nom:document.getElementById('nom').value.trim(),hij:h,eda:e,gra:document.getElementById('gra').value.trim()};
st.ans=[];st.i=0;st.step='q';render()};
var v=document.getElementById('vr');if(v)v.onclick=function(){st.step='rep';render()}}
function ask(){
var T=ITEMS.length+SIG.length,i=st.i,sig=i>=ITEMS.length;
var txt=sig?SIG[i-ITEMS.length]:ITEMS[i][1];
app.innerHTML='<p class="mu sans">Pregunta '+(i+1)+' de '+T+(sig?' · Señales escolares del hijo/a':'')+'</p><div class="bar"><i style="width:'+(i/T*100)+'%"></i></div>'+
'<p class="q">'+esc(txt)+'</p>'+OPT.map(function(o,k){return '<button class="opt" data-v="'+(k+1)+'">'+o+'</button>'}).join('')+
(i?'<div class="row"><button class="s" id="bk">Anterior</button></div>':'');
[].forEach.call(app.querySelectorAll('.opt'),function(b){b.onclick=function(){st.ans[i]=+b.dataset.v;st.i++;if(st.i>=T)finish();else ask()}});
var bk=document.getElementById('bk');if(bk)bk.onclick=function(){st.i--;ask()}}
function finish(){
var sc={},n={};DIMS.forEach(function(d){sc[d.k]=0;n[d.k]=0});
ITEMS.forEach(function(it,i){var v=st.ans[i];if(it[2])v=6-v;sc[it[0]]+=v;n[it[0]]++});
var p={},tot=0;DIMS.forEach(function(d){p[d.k]=Math.round((sc[d.k]/n[d.k]-1)/4*100);tot+=p[d.k]});
var close=Math.round(tot/DIMS.length),s=SIG.map(function(_,j){return st.ans[ITEMS.length+j]});
var sigP=Math.round(s.reduce(function(a,b){return a+(b-1)/4*100},0)/SIG.length);
var risk=Math.round(0.6*(100-close)+0.4*sigP);
st.res.push({d:st.d,p:p,close:close,s:s,sigP:sigP,risk:risk,date:new Date().toLocaleDateString('es')});
st.step='rep';render()}
function report(r,idx){
var L=lvl(r.risk),fort=[],mej=[];
DIMS.forEach(function(d){if(r.p[d.k]>=55)fort.push(d);else mej.push(d)});
var who=r.d.rol+(r.d.nom?' ('+esc(r.d.nom)+')':''),h=esc(r.d.hij);
var dim=DIMS.map(function(d){return '<tr><td><b>'+d.n+'</b></td><td>'+r.p[d.k]+'/100</td><td><div class="mb"><i style="width:'+r.p[d.k]+'%;background:'+col(r.p[d.k])+'"></i></div></td><td>'+band(r.p[d.k])+'</td></tr>'}).join('');
var interp=DIMS.map(function(d){return '<h3>'+d.n+' — '+band(r.p[d.k])+'</h3><p>'+(r.p[d.k]>=55?d.hi:d.lo)+'</p>'}).join('');
var recs=mej.length?mej.map(function(d){return '<li>'+d.rec+'</li>'}).join(''):'<li>Mantener las prácticas actuales y monitorear periódicamente el bienestar escolar.</li>';
var alerta=r.s[3]>=4?'<div class="al"><b>Señal de alerta:</b> el/la menor ha expresado deseo de abandonar los estudios. Se recomienda entrevista con orientación escolar o psicología en un plazo breve.</div>':'';
var sigT=SIG.map(function(t,j){return '<tr><td>'+t+'</td><td>'+OPT[r.s[j]-1]+'</td></tr>'}).join('');
var resumen='Evaluación de '+who+' respecto de '+h+' ('+r.d.eda+' años). Cercanía global '+r.close+'/100; riesgo estimado de deserción escolar <b>'+L[0].toLowerCase()+'</b> (índice '+r.risk+'/100). '+
(fort.length?'Fortalezas: '+fort.map(function(d){return d.n.toLowerCase()}).join(', ')+'. ':'')+(mej.length?'Prioridades: '+mej.map(function(d){return d.n.toLowerCase()}).join(', ')+'.':'Sin áreas críticas identificadas.');
return '<div class="card sum"><h3 style="margin-top:0">Resumen del informe</h3><p>'+resumen+'</p>'+alerta+'</div>'+
'<h2>Informe clínico</h2>'+
'<div class="card"><h3 style="margin-top:0">1. Datos de la evaluación</h3><p>Informante: '+who+'. Menor evaluado/a: '+h+', '+r.d.eda+' años'+(r.d.gra?', '+esc(r.d.gra):'')+'. Fecha: '+r.date+'.</p>'+
'<h3>2. Motivo y método</h3><p>Cribado autoinformado del vínculo parento-filial (15 ítems, 5 dimensiones, escala 1–5 con ítems invertidos) y 4 señales escolares de riesgo. Índice de riesgo = 60 % déficit de cercanía + 40 % señales escolares.</p></div>'+
'<div class="card"><h3 style="margin-top:0">3. Resultados</h3><p>Cercanía global: <b>'+r.close+'/100</b>. Señales escolares: <b>'+r.sigP+'/100</b>. Riesgo de deserción: <span class="tag" style="background:'+L[1]+'">'+L[0]+' ('+r.risk+')</span></p>'+
'<div class="tw"><table><tr><th>Dimensión</th><th>Puntaje</th><th></th><th>Nivel</th></tr>'+dim+'</table></div>'+
'<h3>Señales escolares reportadas</h3><div class="tw"><table>'+sigT+'</table></div></div>'+
'<div class="card"><h3 style="margin-top:0">4. Interpretación</h3>'+interp+'</div>'+
'<div class="card"><h3 style="margin-top:0">5. Recomendaciones</h3><ul>'+recs+(r.risk>=45?'<li>Derivar a orientación escolar o psicología para evaluación completa y plan de prevención.</li>':'')+'</ul></div>'+
'<p class="mu">Limitaciones: instrumento orientativo sin validación psicométrica; se basa en la percepción de un solo informante. Los resultados deben contrastarse con la visión del menor, la escuela y un profesional de salud mental.</p>'}
function compare(){
var a=st.res[st.res.length-2],b=st.res[st.res.length-1];
var rows=DIMS.map(function(d){var g=Math.abs(a.p[d.k]-b.p[d.k]);return '<tr><td><b>'+d.n+'</b></td><td>'+a.p[d.k]+'</td><td>'+b.p[d.k]+'</td><td>'+(g>=20?'Brecha de '+g+' pts':'Similar')+'</td></tr>'}).join('');
var gl=Math.abs(a.close-b.close),m=Math.max(a.risk,b.risk);
var txt='Cercanía global: '+a.d.rol+' '+a.close+', '+b.d.rol+' '+b.close+'. '+(gl>=15?'Existe una diferencia relevante ('+gl+' pts): el vínculo se concentra en un solo progenitor, lo que puede dejar al menor sin figura de apoyo alternativa. ':'Los vínculos son comparables. ')+'Riesgo más alto registrado: '+lvl(m)[0].toLowerCase()+' ('+m+').';
return '<h2>Comparativa entre progenitores</h2><div class="card sum"><p>'+txt+'</p></div><div class="card tw"><table><tr><th>Dimensión</th><th>'+esc(a.d.rol)+'</th><th>'+esc(b.d.rol)+'</th><th>Lectura</th></tr>'+rows+'</table></div>'}
function repView(){
var last=st.res[st.res.length-1];
app.innerHTML='<h1>Resultados</h1>'+(st.res.length>1?compare():'')+report(last)+
'<div class="row noprint"><button id="nx">Evaluar a otro progenitor</button><button class="s" id="pr">Imprimir o guardar PDF</button></div>'+
(st.res.length>1?'<div class="row noprint"><button class="s" id="rs">Reiniciar todo</button></div>':'');
document.getElementById('nx').onclick=function(){st.step='intro';render()};
document.getElementById('pr').onclick=function(){window.print()};
var rs=document.getElementById('rs');if(rs)rs.onclick=function(){st.res=[];st.step='intro';render()};
window.scrollTo(0,0)}
function render(){if(st.step==='intro')intro();else if(st.step==='q')ask();else repView();window.scrollTo(0,0)}
render();
</script>
</body>
</html>
